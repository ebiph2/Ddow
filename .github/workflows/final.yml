name: Pro Downloader Splitter Ultimate (Fast Cached)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separated by new line"
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip

      - name: Install yt-dlp
        run: |
          pip install -U yt-dlp

      - name: Prepare Workspace
        run: |
          rm -rf downloads temp repo_files
          mkdir -p downloads temp repo_files

      - name: Save URL list
        run: |
          echo "${{ inputs.urls }}" > temp/urls.txt

      - name: Download Files
        run: |
          cd downloads
          counter=1

          while read url
          do
            [ -z "$url" ] && continue

            echo "======================================="
            echo "PROCESSING URL:"
            echo "$url"
            echo "======================================="

            folder="file_$counter"
            mkdir -p "$folder"
            cd "$folder"

            yt-dlp \
              --newline \
              --ignore-errors \
              --continue \
              --no-playlist \
              --concurrent-fragments 8 \
              --fragment-retries 20 \
              --extractor-retries 20 \
              --retries 20 \
              --file-access-retries 20 \
              --retry-sleep 5 \
              --socket-timeout 60 \
              --referer "$url" \
              --add-header "User-Agent: Mozilla/5.0" \
              --geo-bypass \
              --min-filesize 20M \
              -f "bv*+ba/b" \
              -S "ext:mp4:m4a" \
              --recode-video mp4 \
              --merge-output-format mp4 \
              -o "%(title).150s.%(ext)s" \
              "$url"

            cd ..
            counter=$((counter+1))

          done < ../temp/urls.txt

          echo "Removing files smaller than 20MB..."
          find . -type f -size -20M -delete

      - name: Verify Downloads
        run: |
          cd downloads
          files=$(find . -type f)

          if [ -z "$files" ]; then
            echo "No valid files downloaded"
            exit 1
          fi

          echo "$files" | while read file
          do
            if [ ! -s "$file" ]; then
              echo "FAILED: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Split Files (ZIP instead of RAR)
        run: |
          cd downloads

          find . -type f | while read file
          do
            filename=$(basename "$file")
            cleanname=$(echo "$filename" | tr ' ' '_' | tr -cd '[:alnum:]_.-')

            echo "Processing: $filename"

            mkdir -p "../repo_files/$cleanname"

            zip -0 -s 49m "../repo_files/$cleanname/$cleanname.zip" "$file"
          done

      - name: Generate SHA256 Checksums
        run: |
          cd repo_files

          find . -type f ! -name "checksums.txt" | while read file
          do
            sha256sum "$file"
          done > checksums.txt

      - name: Generate Download Links
        run: |
          cd repo_files

          rm -f links.txt
          BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/repo_files"

          find . -type f \
            ! -name "links.txt" \
            ! -name "checksums.txt" \
            | sort \
            | while read file
          do
            clean=$(echo "$file" | sed 's#^\./##')
            echo "$BASE_URL/$clean" >> links.txt
          done

      - name: Commit Files Safely
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add repo_files
          git diff --cached --quiet || git commit -m "Auto upload files"

      - name: Push To Repository
        run: |
          git push

      - name: Cleanup
        run: |
          rm -rf downloads temp
