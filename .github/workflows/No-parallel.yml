name: Pro Downloader Splitter

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Direct URLs separated by new line"
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            rar \
            wget \
            aria2 \
            coreutils

      - name: Prepare Workspace
        run: |
          mkdir -p downloads
          mkdir -p repo_files
          mkdir -p temp

      - name: Save URL list
        run: |
          echo "${{ inputs.urls }}" > temp/urls.txt

      - name: Download Files
        run: |
          cd downloads

          while read url
          do
            [ -z "$url" ] && continue

            filename=$(basename "$url")

            echo "DOWNLOADING: $filename"

            aria2c \
              -x 8 \
              -s 8 \
              -k 1M \
              --retry-wait=5 \
              --max-tries=10 \
              --timeout=60 \
              --summary-interval=5 \
              -o "$filename" \
              "$url"

          done < ../temp/urls.txt

      - name: Verify Downloads
        run: |
          cd downloads

          for file in *
          do
            if [ ! -s "$file" ]; then
              echo "FAILED: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Split Files Using RAR
        run: |
          cd downloads

          for file in *
          do
            echo "PROCESSING: $file"

            rar a \
              -v49m \
              -m0 \
              "../repo_files/${file}.rar" \
              "$file"

          done

      - name: Generate SHA256 Checksums
        run: |
          cd repo_files

          sha256sum * > checksums.txt

      - name: Generate Direct Links
        run: |
          BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/repo_files"

          cd repo_files

          rm -f links.txt

          find . -type f \
            ! -name "links.txt" \
            ! -name "checksums.txt" \
            | sort \
            | while read file
          do
            clean=$(echo "$file" | sed 's#^\./##')

            echo "$BASE_URL/$clean" >> links.txt
          done

      - name: Git Status
        run: |
          git status

      - name: Commit Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add repo_files

          git commit -m "Auto upload split files" || echo "Nothing to commit"

      - name: Push To Repository
        run: |
          git push

      - name: Cleanup
        run: |
          rm -rf downloads
          rm -rf temp
