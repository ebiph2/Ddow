name: Pro Downloader Splitter Ultimate

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separated by new line"
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            rar \
            wget \
            curl \
            aria2 \
            ffmpeg \
            python3-pip \
            coreutils \
            jq

          pip install -U yt-dlp

      - name: Prepare Workspace
        run: |
          rm -rf downloads
          rm -rf temp

          mkdir -p downloads
          mkdir -p repo_files
          mkdir -p temp

      - name: Save URL list
        run: |
          echo "${{ inputs.urls }}" > temp/urls.txt

      - name: Download Files
        run: |
          cd downloads

          counter=1

          while read url
          do
            [ -z "$url" ] && continue

            echo "======================================="
            echo "PROCESSING URL:"
            echo "$url"
            echo "======================================="

            folder="file_$counter"

            mkdir -p "$folder"

            cd "$folder"

            yt-dlp \
              --newline \
              --ignore-errors \
              --continue \
              --no-playlist \
              --concurrent-fragments 8 \
              --fragment-retries 20 \
              --extractor-retries 20 \
              --retries 20 \
              --file-access-retries 20 \
              --retry-sleep 5 \
              --socket-timeout 60 \
              --downloader aria2c \
              --downloader-args "aria2c:-x 8 -s 8 -k 1M --retry-wait=5 --max-tries=20" \
              -f "bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              -o "%(title).150s.%(ext)s" \
              "$url"

            cd ..

            counter=$((counter+1))

          done < ../temp/urls.txt

      - name: Verify Downloads
        run: |
          cd downloads

          found=0

          find . -type f | while read file
          do
            if [ ! -s "$file" ]; then
              echo "FAILED: $file"
              exit 1
            fi

            echo "OK: $file"

            found=1
          done

      - name: Split Files Using RAR
        run: |
          cd downloads

          find . -type f | while read file
          do
            filename=$(basename "$file")

            cleanname=$(echo "$filename" | tr ' ' '_' | tr -cd '[:alnum:]_.-')

            echo "======================================="
            echo "PROCESSING FILE:"
            echo "$filename"
            echo "======================================="

            mkdir -p "../repo_files/$cleanname"

            rar a \
              -v49m \
              -m0 \
              "../repo_files/$cleanname/$cleanname.rar" \
              "$file"

          done

      - name: Generate SHA256 Checksums
        run: |
          cd repo_files

          find . -type f ! -name "checksums.txt" | while read file
          do
            sha256sum "$file"
          done > checksums.txt

      - name: Generate Download Links
        run: |
          cd repo_files

          rm -f links.txt

          BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/repo_files"

          find . -type f \
            ! -name "links.txt" \
            ! -name "checksums.txt" \
            | sort \
            | while read file
          do
            clean=$(echo "$file" | sed 's#^\./##')

            echo "$BASE_URL/$clean" >> links.txt
          done

      - name: Generate Join Scripts
        run: |
          cd repo_files

          for dir in */
          do
            [ -d "$dir" ] || continue

            cd "$dir"

            base=$(ls *.part1.rar 2>/dev/null | head -n 1)

            if [ ! -z "$base" ]; then

              name=$(echo "$base" | sed 's/\.part1\.rar//')

              echo '@echo off' > join.bat
              echo 'echo Extract using WinRAR or 7zip' >> join.bat
              echo 'pause' >> join.bat

            fi

            cd ..
          done

      - name: Git Status
        run: |
          git status

      - name: Commit Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add repo_files

          git commit -m "Auto upload split files" || echo "Nothing to commit"

      - name: Push To Repository
        run: |
          git push

      - name: Cleanup
        run: |
          rm -rf downloads
          rm -rf temp
