name: Download And Upload Asset

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: Direct file URL
        required: true

permissions:
  contents: write

concurrency:
  group: asset-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Download file
        run: |
          URL="${{ github.event.inputs.file_url }}"

          FILE=$(basename "${URL%%\?*}")

          curl -L --fail "$URL" -o "$FILE"

          echo "FILE_NAME=$FILE" >> $GITHUB_ENV

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view assets-storage >/dev/null 2>&1 || \
          gh release create assets-storage \
            --title "Assets Storage"

      - name: Generate unique asset name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ORIGINAL="${{ env.FILE_NAME }}"

          BASENAME="${ORIGINAL%.*}"
          EXTENSION="${ORIGINAL##*.}"

          if [ "$BASENAME" = "$EXTENSION" ]; then
            EXTENSION=""
          else
            EXTENSION=".$EXTENSION"
          fi

          NEWNAME="$ORIGINAL"
          COUNT=1

          while gh release view assets-storage --json assets \
            --jq '.assets[].name' | grep -Fxq "$NEWNAME"; do

            NEWNAME="${BASENAME}-${COUNT}${EXTENSION}"
            COUNT=$((COUNT+1))
          done

          echo "UPLOAD_NAME=$NEWNAME" >> $GITHUB_ENV

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload assets-storage \
            "${{ env.FILE_NAME }}#${{ env.UPLOAD_NAME }}"

      - name: Show result
        run: |
          echo "Uploaded as: ${{ env.UPLOAD_NAME }}"
